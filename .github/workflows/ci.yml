name: CI

# Typecheck, the full test suite (Rust sanitizer corpus + the JS unit suites),
# and the OpenAPI freshness gate. Mirrors what `npm run typecheck && npm test`
# does locally.
#
# WASM IS BUILT HERE, and that is a change from the original issue-#19 setup.
# `tsc` still resolves the sanitizer imports through src/wasm.d.ts and the cargo
# tests still build from sanitizer/src, so most of the suite remains WASM-free.
# But `test:docs-bundle` (issue #4) re-runs scripts/build-docs.mjs to prove the
# committed src/generated bundle is fresh, and that script renders Markdown
# through the real sanitizer — deliberately, so the freshness gate cannot
# disagree with the builder about the bytes. sanitizer/pkg is gitignored, so a
# fresh checkout has to produce it. If you are tempted to drop this step to get
# the fresh-checkout property back, the cost is that a stale documentation
# bundle ships silently.

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck · test · openapi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22" # matches local dev; the test runner needs --experimental-strip-types (Node >= 22.6)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust (host target for the cargo corpus, wasm32 for the bundle)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sanitizer

      - name: Install wasm-pack (for the docs-bundle freshness gate)
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the WASM sanitizer
        run: npm run build:wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Test (sanitizer cargo corpus + JS unit suites)
        run: npm test

      - name: OpenAPI spec is committed fresh
        run: |
          npm run build:openapi
          if ! git diff --exit-code openapi.json; then
            echo "::error file=openapi.json::openapi.json is stale — run 'npm run build:openapi' and commit the result. If the wire shape moved: on a stable branch bump OPENAPI_INFO_VERSION per semver; on the '2.0' breaking-change branch do NOT bump it — add a ledger entry above the constant in src/openapi.ts instead."
            exit 1
          fi
