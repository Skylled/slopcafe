name: CI

# Four parallel jobs:
# 1. build: Typecheck, the full unit test suite (Rust sanitizer corpus + the JS
#    unit suites), and the OpenAPI freshness gate. Mirrors `npm run typecheck && npm test`.
# 2. e2e: The live Worker integration suite (issue #54). Spins up `wrangler dev`
#    against local D1/R2, applies migrations, and executes test/e2e/*.sh: the
#    publication gate (#43), no-op collapse, MCP Apps wire surface, CORS, and
#    curation.
# 3. secrets: gitleaks over the FULL history (issue #30) — the default ruleset
#    plus the repo-specific rules in .gitleaks.toml; reviewed non-secrets are
#    quarantined by fingerprint in .gitleaksignore.
# 4. lockstep: a soft, non-blocking nudge (issue #56) — diffs the changed
#    files against the base ref and runs scripts/lockstep-check.mjs over them,
#    which prints a `::warning::` annotation per lockstep file-group (per
#    CLAUDE.md/CONTRIBUTING.md) touched by only some of its members. Never
#    fails the job — see the job for why.
#
# WASM is built in the first two jobs:
# - `build` needs it for `test:docs-bundle` (issue #4), which renders Markdown
#   through the real sanitizer to verify the committed documentation bundle is fresh.
# - `e2e` needs it because `wrangler dev` bundles the CompiledWasm rule.

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck · test · openapi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22" # matches local dev; the test runner needs --experimental-strip-types (Node >= 22.6)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust (host target for the cargo corpus, wasm32 for the bundle)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sanitizer

      - name: Install wasm-pack (for the docs-bundle freshness gate)
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the WASM sanitizer
        run: npm run build:wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Test (sanitizer cargo corpus + JS unit suites)
        run: npm test

      - name: OpenAPI spec is committed fresh
        run: |
          npm run build:openapi
          if ! git diff --exit-code openapi.json; then
            echo "::error file=openapi.json::openapi.json is stale — run 'npm run build:openapi' and commit the result. If the wire shape moved: on a stable branch bump OPENAPI_INFO_VERSION per semver; while a breaking window is open (the 3.0 window, until mcp-2026-07-28 merges) do NOT bump it — add a ledger entry above the constant in src/openapi.ts instead."
            exit 1
          fi

  e2e:
    name: e2e (wrangler dev · d1 · r2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust (for WASM sanitizer build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sanitizer

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the WASM sanitizer
        run: npm run build:wasm

      - name: Build docs bundle
        run: npm run build:docs

      - name: Run E2E test suite (test/e2e/*.sh)
        run: npm run test:e2e

  secrets:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — gitleaks walks every commit)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lockstep:
    name: lockstep nudge (informational)
    runs-on: ubuntu-latest
    # Never fails the run — see scripts/lockstep-check.mjs. Belt-and-suspenders
    # on top of the script's own unconditional `process.exit(0)`.
    continue-on-error: true
    steps:
      - name: Checkout (full history — need the base/before commit to diff against)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compute changed files and run the lockstep nudge
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A new branch's first push carries the all-zeros SHA as `before` —
            # nothing to diff against upstream, so fall back to the one commit
            # actually being pushed.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi
          git diff --name-only "$BASE" "${{ github.sha }}" > /tmp/changed_files.txt || : > /tmp/changed_files.txt
          node scripts/lockstep-check.mjs < /tmp/changed_files.txt
